name: CI
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.9

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Cache du binaire Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec napi-postinstall unrs-resolver 1.11.1 check
          pnpm rebuild @parcel/watcher

      - name: Installer le binaire Cypress
        run: pnpm --filter web exec cypress install

      - name: Vérifier le binaire Cypress
        run: pnpm --filter web exec cypress verify

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Créer .env.test
        run: cp .env.test.example .env.test   # ou le bloc "cat > .env.test" vu plus haut

      - name: Test(e2e)
        run: pnpm test:e2e

      - name: Publier les logs e2e
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            logs/e2e/
            apps/web/.next-e2e.log
            apps/web/cypress/videos/
            apps/web/cypress/screenshots/
          if-no-files-found: ignore

      - name: Lint
        run: pnpm lint

      - name: Format code
        run: pnpm format