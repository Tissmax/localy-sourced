x-nest: &nest
  build:
    context: .
    target: dev
  environment:
    NODE_ENV: development
  volumes:
    - .:/app
    # Empêche le node_modules de l'hôte d'écraser celui du conteneur
    - /app/node_modules
    - /app/apps/api/node_modules

services:
#--------FRONT
#Conteneur NextJS pour le front
  web:
    container_name: web
    build:
      context: .
      dockerfile: apps/Dockerfile.next
    restart: always
    ports:
      - 3000:3000
    develop:
      watch:
        - path: .
          target: /src
          action: sync
        - path: .
          target: package.json
          action: rebuild

  #--------BACK
  nats:
    container_name: nats
    image: nats:2.9.22-alpine
    restart: always
    ports:
      - 4222:4222
      - 8222:8222
  
  redis:
    container_name: redis
    image: redis:7.2.0-alpine
    restart: always
    ports:
      - 6379:6379

#Image utilisée pour build toutes les applications NestJS du monorepo
  base:
    image: monorepo-base
    build:
      context: .
      dockerfile: apps/Dockerfile.nest
    entrypoint: ["true"]   # ce service ne sert qu'à être buildé
    restart: "no"

  gateway:
    <<: *nest
    command: pnpm exec rspack build --watch -c apps/api/apps/gateway/rspack.config.mjs
    ports: ["3001:3001"]

  products:
    <<: *nest
    command: pnpm exec rspack build --watch -c apps/api/apps/products/rspack.config.mjs
  sales:
    <<: *nest
    command: pnpm exec rspack build --watch -c apps/api/apps/sales/rspack.config.mjs

  users:
    <<: *nest
    command: pnpm exec rspack build --watch -c apps/api/apps/users/rspack.config.mjs
  
  postgres:
    container_name: postgres
    image: postgres:15.4-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: