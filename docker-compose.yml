services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./:/app
      - pnpm_store:/pnpm/store
      - web_dist:/app/apps/web/dist
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/schema/node_modules
      - /app/packages/typescript-config/node_modules
      - /app/packages/tailwind-config/node_modules
      - /app/packages/jest-config/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/ui/node_modules
  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    volumes:
      - ./:/app
      - pnpm_store:/pnpm/store
      - api_dist:/app/apps/api/dist
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/schema/node_modules
      - /app/packages/typescript-config/node_modules
      - /app/packages/tailwind-config/node_modules
      - /app/packages/jest-config/node_modules
      - /app/packages/eslint-config/node_modules
      - /app/packages/ui/node_modules

volumes:
  pnpm_store:
  api_dist:
  web_dist: